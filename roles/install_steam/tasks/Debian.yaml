---
# The Steam .deb package installs the Steam launcher and configures Valve's
# APT repository, but it does not enable the i386 architecture or install all
# required Steam libraries. These steps are handled separately so Steam can
# start without requiring a manual sudo prompt to install missing packages.
- name: Get the enabled foreign architectures
  ansible.builtin.command: dpkg --print-foreign-architectures
  register: install_steam_foreign_architectures
  changed_when: false

- name: Enable 32-bit (i386) packages
  ansible.builtin.command: dpkg --add-architecture i386
  when: "'i386' not in install_steam_foreign_architectures.stdout_lines"
  changed_when: true
  become: true

# Retry the download in case of a temporary network or DNS failure.
- name: Install Steam
  ansible.builtin.apt:
    deb: https://cdn.akamai.steamstatic.com/client/installer/steam.deb
  register: install_steam_deb
  until: install_steam_deb is succeeded
  retries: 3
  delay: 10
  become: true

- name: Install Steam libraries
  ansible.builtin.apt:
    name:
      - steam-libs-amd64
      - steam-libs-i386
    state: present
    update_cache: true
  become: true
