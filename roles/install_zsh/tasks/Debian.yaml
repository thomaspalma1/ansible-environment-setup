---
- name: Install Zsh
  ansible.builtin.apt:
    name: zsh
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Get the username whose default shell will be changed
  ansible.builtin.command: id -un
  register: install_zsh_user
  changed_when: false
  become: false

- name: Set Zsh as the default shell
  ansible.builtin.user:
    name: "{{ install_zsh_user.stdout }}"
    shell: /usr/bin/zsh
  become: true

# Zsh does not read ~/.profile, which is where Debian and Ubuntu add
# ~/.local/bin (used by pipx and pip --user) to PATH.
- name: Load ~/.profile in Zsh login shells
  ansible.builtin.lineinfile:
    path: ~/.zprofile
    line: "[[ -f ~/.profile ]] && emulate sh -c '. ~/.profile'"
    create: true
    mode: "0644"
  become: false
