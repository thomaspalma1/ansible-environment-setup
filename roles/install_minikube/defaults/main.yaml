---
# The release files have no version in their names, so this link always points to
# the latest release
install_minikube_release_url: https://github.com/kubernetes/minikube/releases/latest/download
install_minikube_arch: amd64 # 64-bit Intel/AMD (x86_64)
install_minikube_path: /usr/local/bin/minikube
