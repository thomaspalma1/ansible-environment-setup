---
# Retry the download in case of a temporary network or DNS failure.
- name: Install Discord
  ansible.builtin.apt:
    deb: https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=linux&arch=x64&format=deb
  register: install_discord_deb
  until: install_discord_deb is succeeded
  retries: 3
  delay: 10
  become: true
