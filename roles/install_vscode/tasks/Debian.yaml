---
# The .deb writes the Microsoft key with gpg. Without gpg the key file is left
# empty, every later apt update fails, and reinstalling does not rewrite it.
- name: Install prerequisites
  ansible.builtin.apt:
    name: gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# Retry the download if the server or DNS fails for a moment, instead of failing the run.
- name: Install Visual Studio Code
  ansible.builtin.apt:
    deb: https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64
  register: install_vscode_deb
  until: install_vscode_deb is succeeded
  retries: 3
  delay: 10
  become: true
