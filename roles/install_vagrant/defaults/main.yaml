---
install_vagrant_prerequisites:
  - ca-certificates
  - python3-debian

install_vagrant_packages:
  - vagrant

install_vagrant_keyring_path: /usr/share/keyrings/hashicorp-archive-keyring.asc
install_vagrant_keyring_url: https://apt.releases.hashicorp.com/gpg
install_vagrant_repo_uri: https://apt.releases.hashicorp.com
install_vagrant_repo_component: main
