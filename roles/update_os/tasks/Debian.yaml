---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ update_os_cache_valid_time }}"
  become: true

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: "{{ update_os_upgrade_type }}"
  become: true

- name: Remove orphaned packages
  ansible.builtin.apt:
    autoremove: true
  become: true

- name: Clean old package cache
  ansible.builtin.apt:
    autoclean: true
  become: true

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Reboot the machine
  ansible.builtin.reboot:
    msg: Reboot triggered by Ansible after package upgrade
    reboot_timeout: 300
  become: true
  when:
    - update_os_reboot_if_required
    - reboot_required_file.stat.exists

- name: Notify pending reboot
  ansible.builtin.debug:
    msg: "A reboot is required after the updates."
  when:
    - not update_os_reboot_if_required
    - reboot_required_file.stat.exists
