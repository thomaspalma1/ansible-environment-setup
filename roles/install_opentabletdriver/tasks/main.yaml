---
- name: Install OpenTabletDriver based on OS
  ansible.builtin.include_tasks: "{{ lookup('ansible.builtin.first_found', install_opentabletdriver_task_files) }}"
  vars:
    install_opentabletdriver_task_files:
      - "{{ ansible_facts['distribution'] }}.yaml"
      - "{{ ansible_facts['os_family'] }}.yaml"
