---
- name: Install prerequisites
  ansible.builtin.apt:
    name: "{{ install_spotify_prerequisites }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Add Spotify apt repository
  ansible.builtin.deb822_repository:
    name: spotify
    types: deb
    uris: "{{ install_spotify_repo_uri }}"
    suites: "{{ install_spotify_repo_suite }}"
    components: "{{ install_spotify_repo_component }}"
    architectures: "{{ install_spotify_repo_architectures }}"
    signed_by: "{{ install_spotify_keyring_url }}"
    state: present
  become: true

- name: Keep spotify-client from adding a duplicate repository
  ansible.builtin.copy:
    content: |
      # The Spotify repository is configured in spotify.sources.
      # spotify-client only adds its own repository when this file does not exist.
    dest: /etc/apt/sources.list.d/spotify.list
    mode: "0644"
  become: true

- name: Install Spotify packages
  ansible.builtin.apt:
    name: "{{ install_spotify_packages }}"
    state: present
    update_cache: true
  become: true
