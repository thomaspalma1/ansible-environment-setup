---
- name: Install prerequisites
  ansible.builtin.apt:
    name: "{{ install_spotify_prerequisites }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Download Spotify GPG key
  ansible.builtin.get_url:
    url: "{{ install_spotify_keyring_url }}"
    dest: "{{ install_spotify_keyring_path }}"
    mode: "0644"
  become: true

- name: Add Spotify apt repository
  ansible.builtin.copy:
    content: >
      deb [arch={{ install_spotify_repo_architectures | join(',') }}]
      {{ install_spotify_repo_uri }} {{ install_spotify_repo_suite }} {{ install_spotify_repo_component }}
    dest: /etc/apt/sources.list.d/spotify.list
    mode: "0644"
  become: true

- name: Install Spotify packages
  ansible.builtin.apt:
    name: "{{ install_spotify_packages }}"
    state: present
    update_cache: true
  become: true
