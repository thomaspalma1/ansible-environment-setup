---
- name: Set up the environment
  hosts: localhost
  connection: local
  vars:
    # Run modules with the system Python, which has python3-apt and python3-debian.
    # Ansible installed with pipx would otherwise run them with its own isolated Python.
    ansible_python_interpreter: /usr/bin/python3
    install_docker_users:
      - "{{ ansible_facts['user_id'] }}"
  roles:
    - update_os
    - install_base_packages
    - install_zsh
    - install_vim
    - install_brave
    - install_docker
    - install_terraform
    - install_vagrant
    - install_kubectl
    - install_vscode
    - install_github_desktop
    - install_latex
    - install_discord
    - install_spotify
    - install_steam
